<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anamnese Nutricional • Gustavo Amorim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --header-bg: #092c25;
  --bg-page: #f1f4f2;
  --card-bg: #ffffff;
  --text-primary: #122822;
  --text-muted: #6b7c76;
  --border-color: #e2e8e5;
  --input-bg: #f8faf9;
  --btn-green: #0d3e34;
  --btn-green-hover: #072922;
  --info-bg: #eaf2ee;
  --accent-bar: #58d8ab;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header Banner */
header {
  background: linear-gradient(135deg, #051d18 0%, #092c25 60%, #0d3e34 100%);
  color: #ffffff;
  position: relative;
  overflow: hidden;
  padding: 40px 40px 90px;
}

.header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.brand-symbol {
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 700;
  font-style: italic;
  line-height: 1;
  color: #ffffff;
  letter-spacing: -2px;
}

.brand-text {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  line-height: 1.3;
  color: #ffffff;
}

.brand-sub {
  font-weight: 300;
  color: #92b8ac;
  letter-spacing: 0.25em;
}

header h1 {
  font-size: clamp(2rem, 3.8vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  color: #ffffff;
}

header p {
  color: #9ebdb3;
  font-size: 0.95rem;
  max-width: 400px;
  margin-bottom: 24px;
}

.header-img-container {
  width: 380px;
  height: 210px;
  border-radius: 120px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  flex-shrink: 0;
}

.header-img-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.progress-container {
  max-width: 900px;
  margin: 0 auto;
}

.progress-bar {
  height: 5px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 99px;
  overflow: hidden;
  max-width: 380px;
}

.progress-bar i {
  display: block;
  height: 100%;
  width: 10%;
  background: var(--accent-bar);
  border-radius: inherit;
  transition: width 0.4s ease;
}

/* Card Principal */
main {
  max-width: 820px;
  margin: -50px auto 60px;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}

.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 44px 48px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
}

.step-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
}

.step-icon-bg {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #e4eee9;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-icon-bg svg {
  width: 24px;
  height: 24px;
  stroke: var(--btn-green);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

h2 {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--btn-green);
  letter-spacing: -0.02em;
}

.sub-text {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-top: 2px;
}

/* Form Grid */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px 24px;
}

.span-2 {
  grid-column: span 2;
}

.q-group {
  display: flex;
  flex-direction: column;
}

.q-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.q-group label svg {
  width: 17px;
  height: 17px;
  stroke: var(--btn-green);
  stroke-width: 1.8;
  fill: none;
}

.required-star {
  color: #c0392b;
  margin-left: 2px;
}

.q-group small {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: -2px;
  margin-bottom: 6px;
  line-height: 1.35;
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--text-primary);
  background-color: var(--input-bg);
  transition: all 0.2s ease;
}

input::placeholder, textarea::placeholder {
  color: #b0c0ba;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--btn-green);
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(13, 62, 52, 0.08);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

/* Chips / Buttons Selection */
.chips-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-btn {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--input-bg);
  font-family: inherit;
  font-size: 0.86rem;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.chip-btn:hover {
  border-color: var(--btn-green);
  background: #ffffff;
}

.chip-btn.selected {
  background: var(--btn-green);
  color: #ffffff;
  border-color: var(--btn-green);
}

/* Info Box */
.info-banner {
  background: var(--info-bg);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--btn-green);
}

.info-icon-dot {
  width: 20px;
  height: 20px;
  background: var(--btn-green);
  color: #ffffff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  flex-shrink: 0;
}

/* Navigation Buttons */
.nav-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 32px;
}

.action-btn {
  padding: 12px 28px;
  border-radius: 99px;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-secondary {
  background: transparent;
  border: 1.5px solid var(--btn-green);
  color: var(--btn-green);
}

.btn-secondary:hover {
  background: rgba(13, 62, 52, 0.05);
}

.btn-primary {
  background: var(--btn-green);
  border: none;
  color: #ffffff;
  margin-left: auto;
}

.btn-primary:hover {
  background: var(--btn-green-hover);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* Error State */
.field-error input, .field-error select, .field-error textarea {
  border-color: #c0392b;
  background-color: #fff8f8;
}

.error-text {
  color: #c0392b;
  font-size: 0.78rem;
  margin-top: 4px;
}

/* Success Screen */
.success-screen {
  text-align: center;
  padding: 40px 10px;
}

.success-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--info-bg);
  color: var(--btn-green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  margin: 0 auto 20px;
}

/* Footer */
footer {
  padding: 20px;
  text-align: center;
}

.footer-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  max-width: 420px;
  margin: 0 auto;
}

.footer-line-left, .footer-line-right {
  height: 1px;
  background: #d5e0da;
  flex: 1;
}

@media (max-width: 680px) {
  .header-img-container { display: none; }
  .form-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: span 1; }
  .card { padding: 24px 20px; }
}
</style>
</head>
