:root{--d:#103f35;--m:#20836b;--mint:#83e5c5;--l:#e8f3ef;--e:#c0392b;--ink:#1d3a33;--bg:#f4f8f5;--bd:#d9e6df;--mu:#6f857d;--serif:"Playfair Display","Bodoni MT",Didot,Georgia,serif}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse at 6% 45%,#e1efe7,transparent 36%),radial-gradient(ellipse at 98% 78%,#e6f1ea,transparent 32%),var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;background:linear-gradient(110deg,#062b24,#0b3d33 60%,#0e4a3d);padding:34px 0 128px}
.ph{position:absolute;z-index:-1;inset:0 0 0 28%;background:var(--img) 65% center/cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 48%);mask-image:linear-gradient(90deg,transparent,#000 48%);animation:kb 26s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,#062b24aa,transparent 55%)}
@keyframes kb{to{transform:scale(1.08)}}
.logo{display:flex;align-items:center;gap:16px;color:inherit}.mono{width:64px;height:54px;flex:none;overflow:visible}.mono text{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;fill:currentColor}.mono .g{font-size:54px}.mono .a{font-size:48px}
.dv{width:1px;height:40px;background:#c9e9dc70}.logo b{display:block;font-weight:600;letter-spacing:.22em;font-size:.88rem;white-space:nowrap}.logo small{display:block;font-size:.66rem;letter-spacing:.4em;color:var(--mint);margin-top:3px}
h1{font:500 clamp(2.5rem,7vw,4rem)/1.02 var(--serif);letter-spacing:-.02em;margin:46px 0 16px;animation:up .9s both}h1 em{color:var(--mint);font-style:italic}
.tag{color:#b9f1dd;max-width:380px;margin:0;font-size:1.05rem;line-height:1.5}
.trust{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:26px 0 0}.trust li{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:#ffffff1c;border:1px solid #ffffff2e;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.8rem;font-weight:500}.trust svg{width:16px;height:16px;color:var(--mint)}
.stp{position:relative;z-index:2;margin:-74px 0 18px;padding:20px 26px 16px;background:#fff;border-radius:22px;box-shadow:0 20px 56px #103f351c}
.stp .row{display:flex;align-items:center}.st{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eef4f1;color:#8fa89f;transition:.35s}.st svg{width:18px;height:18px}
.st.done{background:var(--m);color:#fff}.st.cur{background:linear-gradient(135deg,var(--d),var(--m));color:#fff;transform:scale(1.14);box-shadow:0 0 0 6px #20836b22}
.ln{flex:1;height:3px;margin:0 5px;border-radius:3px;background:#e2ece7;transition:.5s}.ln.done{background:var(--m)}
.stl{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:.8rem;color:var(--mu)}.stl b{font:600 1.05rem var(--serif);color:var(--d)}
.card{background:#ffffffee;border:1px solid #fff;border-radius:26px;padding:38px 40px 28px;box-shadow:0 24px 70px #103f3516,0 2px 8px #103f3508}
.in{animation:up .55s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.ch{display:flex;align-items:center;gap:20px;margin-bottom:30px}.badge{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d9ece5,#eaf4f0);border:5px solid #f3f8f6;color:var(--d);box-shadow:0 6px 18px #20836b26}.badge svg{width:30px;height:30px}
h2{margin:0 0 4px;font:600 clamp(1.7rem,4.8vw,2.3rem)/1.12 var(--serif);color:var(--d);letter-spacing:-.02em}.sub{margin:0;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{display:grid;grid-template-columns:32px 1fr;gap:12px;border:1.5px solid var(--bd);border-radius:20px;padding:18px 20px;background:linear-gradient(#fff,#fbfdfc);transition:.2s;min-width:0}
.box:hover,.box:focus-within{border-color:#8fcbb8;box-shadow:0 10px 26px #20836b1a}.full{grid-column:1/-1}
.qi{color:var(--d);padding-top:2px}.qi svg{width:25px;height:25px;display:block}
.box label{display:block;font-weight:650;color:#29483f;margin-bottom:7px}.box label b{color:#e0674a}.box small{display:block;color:var(--mu);font-size:.8rem;margin:-3px 0 9px}
input,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.2s}
input::placeholder,textarea::placeholder{color:#a9b9b3}input:focus,textarea:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 4px #20836b1c}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{padding:10px 16px;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;background:#fff;font:inherit;color:#3e5b51;transition:.18s}

<div class="cc" style="margin-top:16px"><h3>Caminho até a meta</h3><div class="pbar"><i data-w="${prog*100}"></i></div><div class="row3"><div><small>INICIAL</small><b>${n1(pi,1)} kg</b></div><div><small>ATUAL</small><b>${n1(ps,1)} kg</b></div><div><small>META</small><b>${n1(pm,1)} kg</b></div><div><small>FALTAM</small><b>${n1(Math.abs(ps-pm),1)} kg</b></div></div><p class="mu" style="text-align:center;margin:12px 0 0;font-size:.85rem"><b data-n="${prog*100}" data-s="%">${n1(prog*100)}%</b> do caminho percorrido</p></div></section>
<section id="dieta" class="rv"><div class="sh"><span class="badge">${svg('b')}</span><h2>Minha dieta</h2></div><div class="pic"><div><b>Seu cardápio, <em>passo a passo</em></b><span>Feito sob medida para a sua rotina e para o seu objetivo.</span></div></div>
${D.d.length?`<div class="g2" style="margin-top:0"><div class="cc"><h3>Minha dieta × minha meta</h3><div class="tot">${rows.map(r=>`<div class="tr"><b>${r[0]}${r[2]?st(r[1],r[2]):''}</b><div class="pbar"><i data-w="${Math.min(100,r[1]/(r[2]||1)*100)}" style="background:${r[4]}"></i></div><span>${n1(r[1])} / ${n1(r[2])} ${r[3]}</span></div>`).join('')}</div></div>
<div class="cc"><h3>Calorias por refeição</h3>${bars(names.map((k,i)=>({l:SH[k]||k,v:meals[k].reduce((a,x)=>a+(+x.k||0),0),c:[C.c,C.p,C.m,C.g,C.d,'#8E7CC3'][i%6]})),'')}</div></div>
<div style="margin-top:18px">${names.map(k=>`<div class="meal"><div class="mh"><em>${EM[k]||'🍴'}</em><b>${k}</b><span>${n1(meals[k].reduce((a,x)=>a+(+x.k||0),0))} kcal</span></div>${meals[k].map(x=>`<div class="it"><div class="n">${x.a}</div><div class="q">${n1(x.q)} g</div><div class="mx"><u>🔥 ${n1(x.k)} kcal</u><u>P ${n1(x.p,1)} g</u><u>C ${n1(x.c,1)} g</u><u>G ${n1(x.g,1)} g</u></div></div>`).join('')}</div>`).join('')}</div>`:'<div class="cc"><p class="mu">Seu cardápio será exibido aqui assim que estiver pronto.</p></div>'}</section>

 document.querySelectorAll('section').forEach(s=>io.observe(s));spy();
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const s=e.target;s.classList.add('on');s.querySelectorAll('[data-n]').forEach(cnt);s.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');io.unobserve(s)}),{threshold:.12}):{observe(s){s.classList.add('on');s.querySelectorAll('[data-n]').forEach(cnt);s.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%')}};
function cnt(e){const t=+e.dataset.n,d=+e.dataset.d||0,s=e.dataset.s||'';if(isNaN(t)||e.dataset.n==='')return;const t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/1200);e.textContent=n1(t*(1-Math.pow(1-k,3)),d)+s;if(k<1)requestAnimationFrame(f)})(t0)}
function spy(){let c='resumo';document.querySelectorAll('section').forEach(s=>{if(s.getBoundingClientRect().top<160)c=s.id});tab(c)}
addEventListener('scroll',spy,{passive:true});
function tab(id){document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+id))}
function pedir(msg){$('#hn').innerHTML='Meu <em>plano</em>';$('#app').innerHTML=`<div class="card sk" style="margin-top:34px"><h2 style="margin-bottom:8px">${msg}</h2><p>Use o link que a sua nutricionista enviou ou digite o seu código abaixo.</p><div class="cod"><input id="cd" placeholder="Seu código de acesso"><button class="btn pri" style="min-width:0" onclick="location.search='?c='+encodeURIComponent($('#cd').value.trim())">Entrar</button></div></div>`}
(async()=>{$('#tabs').innerHTML='<a href="#resumo" class="on">Resumo</a><a href="#dieta">Minha dieta</a><a href="#evolucao">Evolução</a>';
 const c=new URLSearchParams(location.search).get('c');
 if(!c)return pedir('Acesse o seu plano');
 $('#app').innerHTML='<div class="card sk" style="margin-top:34px"><div class="sp"></div>Carregando o seu plano…</div>';
 try{const D=c=='demo'?DEMO:await (await fetch(ENDPOINT+'?c='+encodeURIComponent(c))).json();
  if(D.erro||!D.m)return pedir('Não encontramos esse código');render(D)}
 catch(_){pedir('Não foi possível carregar agora')}})();
</script></body></html>
